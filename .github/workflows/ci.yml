name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, content and render checks (both packages)
        run: pnpm lint
      - name: Unit tests (both packages)
        run: pnpm test
      - name: Build the site (prerendered)
        run: pnpm --filter client build
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://pressstartgames.github.io/PressStart
      - name: Install Playwright Chromium
        run: pnpm --filter client exec playwright install --with-deps chromium
      - name: Build the three sign-up modes
        run: pnpm --filter client build:e2e
      - name: Playwright + axe (stub, none, fallback; mobile reduced-motion)
        run: pnpm --filter client test:e2e
      - name: Lighthouse CI (mobile) on the built site
        run: pnpm --filter client lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
