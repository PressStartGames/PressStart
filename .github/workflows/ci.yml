name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, content and render checks (both packages)
        run: pnpm lint
      - name: Unit tests (both packages)
        run: pnpm test
      - name: Build the site (prerendered)
        run: pnpm --filter client build
        # Lighthouse runs this build on localhost: the real analytics beacon and GrowthBook would fail there and log
        # console errors (Best Practices), so CI builds it with both off. The deployed builds keep them.
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://pressstartgames.net
          VITE_CF_BEACON_TOKEN: ''
          VITE_GROWTHBOOK_CLIENT_KEY: ''
      - name: Install Playwright Chromium
        run: pnpm --filter client exec playwright install --with-deps chromium
      - name: Build the three sign-up modes
        run: pnpm --filter client build:e2e
      - name: Playwright + axe (stub, none, fallback; mobile reduced-motion)
        run: pnpm --filter client test:e2e
      - name: Lighthouse CI (mobile) on the built site
        run: pnpm --filter client lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  # Every environment's configuration is valid: the strict builds, the config checks and the Wrangler
  # dry-runs (no login, nothing is uploaded).
  environments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the site and the admin console in staging mode
        run: |
          pnpm --filter client build --mode staging
          pnpm --filter admin exec vite build --mode staging
      - name: Wrangler dry-runs, staging and production, for the API, admin and site Workers
        run: |
          pnpm --filter server check:envs
          pnpm --filter admin check:envs
          pnpm --filter site-worker check:envs
      - name: A missing value fails the build fast
        run: |
          if VITE_SITE_URL= VITE_BASE= pnpm --filter client build --mode production; then
            echo "::error::the production build should have failed without VITE_BASE and VITE_SITE_URL"; exit 1
          fi
