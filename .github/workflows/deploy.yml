# RETIRED 2026-11-05 (plans/main-site.md Phase 7). The site now runs on Cloudflare (site-worker/, deployed by
# deploy-staging.yml and deploy-production.yml); beta.pressstartgames.net is a 301 to https://pressstartgames.net/beta
# (beta-redirect/, the beta DNS record proxied). This GitHub Pages job is kept for a two-week grace period as a
# manual fallback only: set the beta DNS record back to DNS only, then run it by hand. Delete it after the grace.
name: Deploy site (GitHub Pages, retired)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Repository variables override the committed client/.env.production only when they are set (an empty
      # one would blank the committed value and, in production mode, fail the config check).
      - name: Write the public build values
        run: bash .github/scripts/write-env-local.sh client production
        env:
          VITE_SIGNUP_ENDPOINT: ${{ vars.VITE_SIGNUP_ENDPOINT }}
          VITE_SIGNUP_FALLBACK_URL: ${{ vars.VITE_SIGNUP_FALLBACK_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Build the prerendered site
        run: pnpm --filter client build --mode production
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://beta.pressstartgames.net
      - name: Publish client/dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
