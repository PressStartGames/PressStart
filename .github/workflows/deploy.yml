# Client -> GitHub Pages (gh-pages branch) on every push to main. The Worker deploys separately
# (deploy-server.yml). The project page lives at https://pressstartgames.github.io/PressStart/,
# so VITE_BASE is /PressStart/; with a custom domain (public/CNAME) set it to /.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the prerendered site
        run: pnpm --filter client build
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://beta.pressstartgames.net
          # Sign-up mode (CLAUDE.md): set VITE_SIGNUP_ENDPOINT to the Worker's origin once it is live
          # (and VITE_TURNSTILE_SITE_KEY); until then the site shows the "coming soon" card.
          VITE_SIGNUP_ENDPOINT: ${{ vars.VITE_SIGNUP_ENDPOINT }}
          VITE_SIGNUP_FALLBACK_URL: ${{ vars.VITE_SIGNUP_FALLBACK_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Publish client/dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
