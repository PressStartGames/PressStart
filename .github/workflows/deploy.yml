# Client -> GitHub Pages (gh-pages branch) on every push to main. The Worker deploys separately
# (deploy-server.yml). The site is served on the custom domain https://beta.pressstartgames.net
# (client/public/CNAME), so VITE_BASE is /.
#
# This is the LIVE beta and stays as it is until the Phase 7 cut-over (the main site and /beta move to
# Cloudflare, beta.pressstartgames.net redirects); Pages is retired after that. The environment workflows
# (deploy-staging.yml, deploy-production.yml, preview.yml) do not touch it.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Repository variables override the committed client/.env.production only when they are set (an empty
      # one would blank the committed value and, in production mode, fail the config check).
      - name: Write the public build values
        run: bash .github/scripts/write-env-local.sh client production
        env:
          VITE_SIGNUP_ENDPOINT: ${{ vars.VITE_SIGNUP_ENDPOINT }}
          VITE_SIGNUP_FALLBACK_URL: ${{ vars.VITE_SIGNUP_FALLBACK_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Build the prerendered site
        run: pnpm --filter client build --mode production
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://beta.pressstartgames.net
      - name: Publish client/dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
