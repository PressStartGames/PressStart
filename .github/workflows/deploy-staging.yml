# Staging: every push to `dev` deploys https://staging.pressstartgames.net (site Worker), its API Worker (after the
# staging D1 migrations) and https://admin-staging.pressstartgames.net. No approval. Branches: `dev` -> staging
# (this file), `main` -> production (deploy-production.yml, approval-gated).
name: Deploy staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      deploy_site: true
    secrets: inherit
