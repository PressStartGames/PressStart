# Production: every push to `main` deploys https://pressstartgames.net (the site Worker), the API Worker (after
# its D1 migrations) and the admin console. The job runs in the GitHub Environment `production`, which has the
# founder as a required reviewer: nothing starts (no build, no migration, no deploy) until the founder approves
# the run in GitHub (Actions -> the run -> Review deployments). Remove the reviewer in Settings -> Environments
# -> production to deploy without the click.
#
# Branches: `staging` -> staging (deploy-staging.yml), `main` -> production (this file). The manual button deploys
# any ref that is already green on staging.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (a commit that is already green on staging)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production-trigger
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      ref: ${{ inputs.ref || github.sha }}
      deploy_site: true
      require_token: true
    secrets: inherit
